name: Updater
on:  
  schedule:
    - cron: '5 23 * * *'
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/updater.yml

permissions: read-all

jobs:
  update-readme-with-blog:
    name: Update this repo's README with latest blog posts
    runs-on: ubuntu-latest
    permissions: 
      contents: write # needed to be able to post the RSS updates
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          disable-sudo: true
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            devopsjournal.io:443          

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        
      - name: Pull in last 5 blog posts
        uses: rajbos-actions/blog-post-workflow@6da0638f66000902e4eb30ce05ed6a9d160c0c05 # master
        with:
          feed_list: "https://devopsjournal.io/blog/atom.xml"
          max_post_count: 5
